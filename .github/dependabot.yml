# One batch of updates a month, so the pull requests do not pile up. The checks in CI say whether a batch is safe.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'knip', 'globals', '@playwright/*']
      runtime:
        patterns: ['react*', 'immer', 'lucide-react', '@fontsource-variable/*', 'delaunator', 'ag-psd']
    ignore:
      # TypeScript stays on 6.0 until typescript-eslint supports 7 (see docs/ARCHITECTURE.md)
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
