        <h1>Bone 2D — free 2D skeletal animation editor in your browser</h1>
        <p>
          An open-source Spine alternative. Build a rig with bones, weighted meshes, skins, IK and physics, animate it with a dopesheet and
          curves, and export to Spine 4.3 (JSON or binary), GIF, video or a sprite sheet. It imports Spine and DragonBones projects. Nothing
          to install, no account, and your files stay on your computer. The interface is in English, Russian and Simplified Chinese.
        </p>
        <p>The editor needs JavaScript. <a href="https://github.com/iamgatz/Bone-2D" style="color: #31d0aa">Source code on GitHub</a></p>
